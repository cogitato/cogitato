# Netlify config for deploying the template prototype from this monorepo (the pilot).
# Prototype repos made from the template use templates/workspace-react/prototypes/checkout/netlify.toml instead.
# The `...` filter builds every workspace package the template depends on before the template.

[build]
  base = "/"
  command = "pnpm install --frozen-lockfile && npx playwright install chromium && pnpm --filter @cogitato/template-checkout... build"
  publish = "templates/workspace-react/prototypes/checkout/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/__kit-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
