name: Release

# On main: open or update the "Version packages" PR from pending changesets. Merging that PR
# stages every new version on npm. The canary job stages a snapshot of main for the platform repo
# to test against (ADR 016).
#
# Nothing goes public from here. Packages are *staged*: npm holds them until a maintainer runs
# `pnpm release:approve` (2FA). Staging uses npm trusted publishing: npm trusts this workflow
# file (release.yml) in this repo, GitHub's OIDC token (id-token: write) proves it's us, and
# there is no npm token. Renaming this file breaks staging until npm's settings are updated.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary:
        description: Publish a canary snapshot of this commit
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release:stage
          commit-message: Version packages
          pr-title: Version packages

  canary:
    if: github.event_name == 'workflow_dispatch' && inputs.canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Snapshots need a pending changeset. One package is enough: the fixed group moves them all.
      - name: Add a throwaway changeset
        run: |
          printf -- '---\n"@cogitato/contract": patch\n---\n\nCanary snapshot.\n' > .changeset/canary-snapshot.md
      - run: pnpm changeset version --snapshot canary
      - run: pnpm build
      - run: pnpm release:stage --tag canary
