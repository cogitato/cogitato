# Netlify config for self-hosting a Cogitato prototype (ADR 013). Create one Netlify site per
# prototype and set its base directory to prototypes/<name>. Every branch push gets a preview whose
# canvas is at /__canvas. Snapshots need Chromium; if it can't run, the build still succeeds and
# the canvas shows placeholders.

[build]
  command = "npx playwright install chromium && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Screens are client-side routes: every path serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Previews may be framed only by their own canvas. Widen this when a team canvas on another
# site needs to show them (Phase 4).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/__kit-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
